<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Mermaid ASCII Renderer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#mermaid-input">Skip to editor</a>
    <header class="app-header">
      <h1>Mermaid ASCII Renderer</h1>
    </header>
    <main class="layout" role="main">
      <section class="panel">
        <label class="panel-label" for="mermaid-input">Mermaid Source</label>
        <textarea
          id="mermaid-input"
          spellcheck="false"
          aria-describedby="status-message"
        ></textarea>
      </section>
      <section class="panel">
        <div class="controls">
          <label class="control">
            <input type="checkbox" id="extended-toggle" />
            Use extended characters
          </label>
          <label class="control">
            Gap X
            <input type="number" id="padding-x" min="0" step="1" />
          </label>
          <label class="control">
            Gap Y
            <input type="number" id="padding-y" min="0" step="1" />
          </label>
          <label class="control">
            Box padding X
            <input type="number" id="box-padding-x" min="0" step="1" value="1" disabled />
          </label>
          <label class="control">
            Box padding Y
            <input type="number" id="box-padding-y" min="0" step="1" value="1" disabled title="Use 0 to remove blank rows inside boxes" />
          </label>
          <label class="control" title="Expand gaps to the largest space required on each axis">
            <input type="checkbox" id="uniform-spacing" disabled />
            Uniform gaps
          </label>
          <label class="control" for="example-select">
            Example
            <select id="example-select">
              <option value="">Choose example…</option>
            </select>
          </label>
          <label class="control" for="heads">
            Arrow heads
            <select id="heads">
              <option value="pointer" selected>Pointer</option>
              <option value="open">Open</option>
              <option value="none">None</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button
            id="render-btn"
            type="button"
            disabled
            aria-keyshortcuts="Control+Enter Meta+Enter"
            title="Render (Ctrl/Cmd+Enter)"
          >
            Render
          </button>
          <button id="clear-btn" type="button">Clear</button>
          <button id="copy-btn" type="button" disabled title="Copy output">
            Copy
          </button>
          <button
            id="download-btn"
            type="button"
            disabled
            aria-keyshortcuts="Control+S Meta+S"
            title="Download (Ctrl/Cmd+S)"
          >
            Download
          </button>
        </div>
      </section>
      <section class="panel">
        <label class="panel-label" for="render-output">Output</label>
        <pre
          id="render-output"
          tabindex="0"
          aria-label="Rendered output"
          role="region"
        ></pre>
      </section>
    </main>
    <p id="status-message" class="status" role="status" aria-live="polite"></p>
    <script src="wasm_exec.js"></script>
    <script src="examples.js"></script>
    <script src="app.js"></script>
  </body>
</html>
